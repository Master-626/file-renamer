[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "file-renamer"
version = "0.1.0"
description = "A powerful, safe, batch file renaming CLI with undo capabilities and Rich formatting."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Xu Jiaqi", email = "jiaqixu12138@gmail.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Environment :: Console",
    "Topic :: Utilities",
]
dependencies = [
    "click>=8.1.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
file-renamer = "file_renamer.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/file_renamer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
