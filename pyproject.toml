[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "file-renamer"
version = "0.1.1"
description = "Safe batch file-renaming CLI with dry-run checks, literal replace, and undo."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Xu Jiaqi", email = "jiaqixu12138@gmail.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Environment :: Console",
    "Topic :: Utilities",
]
dependencies = [
    "click>=8.1.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.6.0",
]

[project.scripts]
file-renamer = "file_renamer.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/file_renamer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py39"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# Defaults, pinned so a future Ruff release cannot widen CI unexpectedly.
select = ["E4", "E7", "E9", "F"]
