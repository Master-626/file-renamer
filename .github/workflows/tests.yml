name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install package and test tools
        run: python -m pip install '.[dev]'
      - name: Ruff
        run: python -m ruff check src tests

  test:
    # Python 3.9 builds are unavailable on newer Ubuntu runner images.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        include:
          - os: windows-2022
            python-version: "3.13"
          - os: macos-15
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test tools
        run: python -m pip install '.[dev]' build
      - name: Test
        run: python -m pytest -q
      - name: Build distributable packages
        run: python -m build
      - name: Check CLI entry point
        run: file-renamer --help
