name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test tools
        run: python -m pip install '.[dev]' build
      - name: Test
        run: python -m pytest -q
      - name: Build distributable packages
        run: python -m build
      - name: Check CLI entry point
        run: file-renamer --help
